name: CI
on:
  pull_request:
    branches: [develop]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BETTERLEAKS_VERSION: 1.10.1 # pinned; bump deliberately
      BETTERLEAKS_SHA256: c174b42d7aa60caf58c0c3e555c0e4bed01fe6b0d99a412bce777b5af4ce913e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        run: |
          curl -sSfL -o betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  betterleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/betterleaks"
          tar -xzf betterleaks.tar.gz -C "$RUNNER_TEMP/betterleaks" betterleaks
          echo "$RUNNER_TEMP/betterleaks" >> "$GITHUB_PATH"
      - run: betterleaks version
      - name: Scan full git history
        run: betterleaks git --redact --verbose --exit-code 1 --log-opts="--full-history --all --diff-filter=tuxdb --diff-merges=first-parent" .
